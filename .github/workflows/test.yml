# On every push and pull request: cdt_c and the bindings build, and the tests pass, on Linux,
# macOS and Windows.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CSharpCDT.sln
      - run: dotnet test CSharpCDT.sln --no-build
